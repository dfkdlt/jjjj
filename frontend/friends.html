<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>친구 - 겜슐랭</title>
<link rel="icon" type="image/png" href="logo.png" />
<link rel="stylesheet" href="style.css" />
<script src="theme.js"></script>
</head>
<body data-page="friends">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
      <a class="brand" href="index.html"><img class="brand-logo" src="logo.png" alt="" width="34" height="36" /><span class="brand-text">겜슐랭</span></a>
      <nav class="topnav" aria-label="주 메뉴">
        <a href="index.html">홈</a>
        <a href="search.html">검색</a>
        <a href="friends.html" aria-current="page">친구</a>
        <a href="my.html">내 페이지</a>
      </nav>
      </div>
      <div class="topbar-user">
        <span id="userLabel"></span>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">
  <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
        <button id="logoutBtn" class="btn btn-quiet" type="button">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="page">
    <h1 class="search-title">친구</h1>
    <p class="search-lead">친구를 추가하면 서로 추천한 게임을 볼 수 있고, 검색 결과에서 어떤 친구가 추천했는지도 알려 드려요.</p>

    <form id="addForm" class="search-form" autocomplete="off">
      <input type="text" id="addInput" class="input" placeholder="친구의 아이디를 정확히 입력하세요" maxlength="50" aria-label="친구 아이디" required />
      <button type="submit" class="btn">친구 요청</button>
    </form>
    <p id="addMsg" class="status" role="status" aria-live="polite"></p>

    <section class="my-section" id="incomingSection" aria-labelledby="incomingHeading" hidden>
      <h2 id="incomingHeading" class="section-title">받은 요청 <span id="incomingCount" class="section-count"></span></h2>
      <ul id="incomingList" class="people"></ul>
    </section>

    <section class="my-section" aria-labelledby="friendsHeading">
      <h2 id="friendsHeading" class="section-title">내 친구 <span id="friendsCount" class="section-count"></span></h2>
      <div id="friendsBox" aria-live="polite"></div>
      <label class="share-toggle" for="shareLikes">
        <input type="checkbox" id="shareLikes" checked />
        <span>내가 추천한 게임을 친구에게 보여주기</span>
      </label>
      <p class="section-help share-help">끄면 친구도 내 추천 목록을 볼 수 없고, 친구의 검색 결과에도 내 추천이 표시되지 않아요. 비추천한 게임과 그 이유는 항상 나만 볼 수 있어요.</p>
    </section>

    <section class="my-section" id="likesSection" aria-labelledby="likesHeading" hidden>
      <h2 id="likesHeading" class="section-title">친구가 추천한 게임 <span id="likesCount" class="section-count"></span></h2>
      <div id="likesBox" aria-live="polite"></div>
    </section>

    <section class="my-section" id="outgoingSection" aria-labelledby="outgoingHeading" hidden>
      <h2 id="outgoingHeading" class="section-title">수락을 기다리는 요청 <span id="outgoingCount" class="section-count"></span></h2>
      <ul id="outgoingList" class="people"></ul>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="detail.js"></script>
  <script src="friends.js"></script>
</body>
</html>
