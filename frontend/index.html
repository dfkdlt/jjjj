<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>홈 - 겜슐랭</title>
<link rel="icon" type="image/png" href="logo.png" />
<link rel="stylesheet" href="style.css" />
<script src="theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
      <a class="brand" href="index.html"><img class="brand-logo" src="logo.png" alt="" width="34" height="36" /><span class="brand-text">겜슐랭</span></a>
      <nav class="topnav" aria-label="주 메뉴">
        <a href="index.html" aria-current="page">홈</a>
        <a href="search.html">검색</a>
        <a href="friends.html">친구</a>
        <a href="my.html">내 페이지</a>
      </nav>
      </div>
      <div class="topbar-user">
        <span id="userLabel"></span>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">
  <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
        <button id="logoutBtn" class="btn btn-quiet" type="button">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="page page-wide">
    <h1 id="greeting" class="search-title">오늘은 어떤 게임을 해볼까요?</h1>
    <p class="search-lead">내가 추천한 게임을 분석해서 취향에 맞는 게임을 골라 드려요. 취향 분석 결과는 <a class="inline-link" href="my.html">내 페이지</a>에서 볼 수 있어요.</p>

    <div id="hintBox" hidden></div>

    <section class="home-section" id="dealsSection" aria-labelledby="dealsHeading" hidden>
      <h2 id="dealsHeading" class="section-title">추천한 게임 할인 중</h2>
      <p id="dealsNote" class="section-help"></p>
      <ul id="dealsGrid" class="tile-grid"></ul>
    </section>

    <section class="home-section" id="friendsSection" aria-labelledby="friendsHeading" hidden>
      <h2 id="friendsHeading" class="section-title">친구들이 추천한 게임</h2>
      <p class="section-help">친구가 추천했고 내가 아직 추천하지 않은 게임이에요. 많은 친구가 추천한 순서예요.</p>
      <ul id="friendsGrid" class="tile-grid"></ul>
    </section>

    <section class="home-section" id="popularSection" aria-labelledby="popularHeading" hidden>
      <h2 id="popularHeading" class="section-title">내 취향의 인기 게임</h2>
      <p id="popularNote" class="section-help"></p>
      <ul id="popularGrid" class="tile-grid"></ul>
    </section>

    <section class="home-section" id="recentTasteSection" aria-labelledby="recentTasteHeading" hidden>
      <h2 id="recentTasteHeading" class="section-title">내 취향의 최근 출시작</h2>
      <p id="recentTasteNote" class="section-help"></p>
      <ul id="recentTasteGrid" class="tile-grid"></ul>
    </section>

    <section class="home-section" aria-labelledby="recentHeading">
      <h2 id="recentHeading" class="section-title">최근 출시한 게임</h2>
      <p class="section-help">리뷰가 10개 이상 모인 게임만 보여줘요.</p>
      <ul id="recentGrid" class="tile-grid"></ul>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="detail.js"></script>
  <script src="home.js"></script>
</body>
</html>
