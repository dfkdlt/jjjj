<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>로그인 - 겜슐랭</title>
<link rel="icon" type="image/png" href="logo.png" />
<link rel="stylesheet" href="style.css" />
<script src="theme.js"></script>
</head>
<body>
  <div class="auth-wrap">
    <button id="themeToggle" class="theme-toggle auth-theme" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">
  <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
    <div class="auth-card">
      <span class="brand"><img class="brand-logo" src="logo.png" alt="" width="34" height="36" />겜슐랭</span>
      <h1 class="auth-heading">리뷰로 고르는 게임</h1>
      <p class="auth-sub">로그인하면 키워드로 게임을 찾고 10점 만점 점수로 비교할 수 있어요.</p>

      <div class="auth-panel">
        <div class="tabs" role="tablist">
          <button id="tabLogin" class="tab active" type="button" role="tab">로그인</button>
          <button id="tabRegister" class="tab" type="button" role="tab">회원가입</button>
        </div>

        <form id="loginForm" class="auth-form">
          <div class="field">
            <label for="loginUsername">아이디</label>
            <input type="text" id="loginUsername" class="input" autocomplete="username" required />
          </div>
          <div class="field">
            <label for="loginPassword">비밀번호</label>
            <input type="password" id="loginPassword" class="input" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn">로그인</button>
        </form>

        <form id="registerForm" class="auth-form" hidden novalidate>
          <div class="field">
            <label for="registerUsername">아이디</label>
            <input type="text" id="registerUsername" class="input" autocomplete="username" minlength="3" maxlength="30" placeholder="3~30자" required />
          </div>

          <div class="field">
            <label for="registerEmail">이메일</label>
            <input type="email" id="registerEmail" class="input" autocomplete="email" maxlength="254" placeholder="example@email.com" required />
            <p id="emailHint" class="hint" role="status" aria-live="polite"></p>
          </div>

          <div class="field">
            <label for="registerPassword">비밀번호</label>
            <input type="password" id="registerPassword" class="input" autocomplete="new-password" maxlength="72" placeholder="8자 이상, 영문+숫자" required />
          </div>
          <div class="field">
            <label for="registerPasswordConfirm">비밀번호 확인</label>
            <input type="password" id="registerPasswordConfirm" class="input" autocomplete="new-password" maxlength="72" placeholder="비밀번호를 한 번 더 입력" required />
            <p id="pwHint" class="hint" role="status" aria-live="polite"></p>
          </div>

          <fieldset class="consent">
            <legend class="sr-only">약관 동의</legend>
            <label class="consent-all"><input type="checkbox" id="agreeAll" /> 전체 동의</label>
            <label class="consent-item"><input type="checkbox" id="agreeTerms" /> <span>(필수) 이용약관에 동의합니다.</span> <a href="terms.html#terms" target="_blank" rel="noopener">보기</a></label>
            <label class="consent-item"><input type="checkbox" id="agreePrivacy" /> <span>(필수) 개인정보 수집·이용에 동의합니다.</span> <a href="terms.html#privacy" target="_blank" rel="noopener">보기</a></label>
          </fieldset>

          <button type="submit" id="registerSubmit" class="btn" disabled>가입하기</button>
        </form>

        <p id="authMessage" class="message" role="status" aria-live="polite"></p>
      </div>

      <div class="legend">
        <p class="legend-title">점수는 이렇게 읽어요</p>
        <div class="legend-row">
          <span class="legend-item"><span class="legend-dot" style="background:var(--tier-top)"></span>9점 이상</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--tier-good)"></span>7~9점</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--tier-mid)"></span>5~7점</span>
          <span class="legend-item"><span class="legend-dot" style="background:var(--tier-low)"></span>5점 미만</span>
        </div>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="auth.js"></script>
</body>
</html>
