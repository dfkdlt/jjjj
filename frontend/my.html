<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>내 페이지 - 겜슐랭</title>
<link rel="stylesheet" href="style.css" />
<script src="theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">10</span><span class="brand-text">겜슐랭</span></a>
      <nav class="topnav" aria-label="주 메뉴">
        <a href="index.html">홈</a>
        <a href="search.html">검색</a>
        <a href="friends.html">친구</a>
        <a href="my.html" aria-current="page">내 페이지</a>
      </nav>
      </div>
      <div class="topbar-user">
        <span id="userLabel"></span>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">
  <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
        <button id="logoutBtn" class="btn btn-quiet" type="button">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="page">
    <h1 class="search-title">내 페이지</h1>
    <p class="search-lead">내 취향 분석과 추천, 비추천한 게임을 한곳에서 볼 수 있어요.</p>

    <p id="statusMessage" class="status" role="status" aria-live="polite"></p>

    <section class="my-section" aria-labelledby="tasteHeading">
      <h2 id="tasteHeading" class="section-title">내 취향</h2>
      <div id="tasteBox" aria-live="polite"></div>
    </section>

    <section class="my-section" aria-labelledby="likedHeading">
      <h2 id="likedHeading" class="section-title">추천한 게임 <span id="likedCount" class="section-count"></span></h2>
      <ol id="resultsGrid" class="results results-plain"></ol>
    </section>

    <section class="my-section" aria-labelledby="dislikedHeading">
      <h2 id="dislikedHeading" class="section-title">비추천한 게임 <span id="dislikedCount" class="section-count"></span></h2>
      <p class="section-help">비추천한 게임은 내 검색 결과에서 숨겨져요. 취소하면 다시 보입니다.</p>
      <ol id="dislikedGrid" class="results results-plain"></ol>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="my.js"></script>
</body>
</html>
