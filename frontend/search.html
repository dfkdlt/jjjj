<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>검색 - 겜슐랭</title>
<link rel="stylesheet" href="style.css" />
<script src="theme.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-left">
      <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">10</span><span class="brand-text">겜슐랭</span></a>
      <nav class="topnav" aria-label="주 메뉴">
        <a href="index.html">홈</a>
        <a href="search.html" aria-current="page">검색</a>
        <a href="friends.html">친구</a>
        <a href="my.html">내 페이지</a>
      </nav>
      </div>
      <div class="topbar-user">
        <span id="userLabel"></span>
        <button id="themeToggle" class="theme-toggle" type="button" aria-label="다크 모드 전환" title="다크 모드 전환">
  <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A8.5 8.5 0 1 1 11.2 3a6.6 6.6 0 0 0 9.8 9.8z"/></svg>
  <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
        <button id="logoutBtn" class="btn btn-quiet" type="button">로그아웃</button>
      </div>
    </div>
  </header>

  <main class="page">
    <h1 class="search-title">어떤 게임을 찾으세요?</h1>
    <p class="search-lead">원하는 게임을 문장으로 설명하면 AI가 이해해서 찾아주고, Steam 리뷰의 추천 비율을 10점 만점으로 환산해 높은 순서로 보여줍니다.</p>

    <form id="searchForm" class="search-form" role="search">
      <input type="text" id="keywordInput" class="input" placeholder="예: 친구들이랑 같이 하는 무서운 멀티게임" maxlength="200" aria-label="검색 키워드" autocomplete="off" required />
      <button type="submit" class="btn">검색</button>
    </form>

    <div id="chips" class="chips" role="group" aria-label="추천 키워드"></div>

    <section id="historyBox" class="history" aria-labelledby="historyHeading" hidden>
      <div class="history-top">
        <h2 id="historyHeading" class="history-heading">검색 기록</h2>
        <button type="button" id="clearHistory" class="link-btn">모두 지우기</button>
      </div>
      <div id="historyRecent" class="history-group" hidden>
        <span class="history-label">최근</span>
        <ul class="history-list"></ul>
      </div>
      <div id="historyFrequent" class="history-group" hidden>
        <span class="history-label">자주 찾은</span>
        <ul class="history-list"></ul>
      </div>
    </section>

    <p id="statusMessage" class="status" role="status" aria-live="polite"></p>

    <ol id="resultsGrid" class="results"></ol>

    <div id="moreBox" class="more-box" hidden>
      <button type="button" id="moreBtn" class="btn btn-more">더 보기</button>
      <p id="moreNote" class="more-note" role="status" aria-live="polite"></p>
    </div>
  </main>

  <script src="config.js"></script>
  <script src="common.js"></script>
  <script src="history.js"></script>
  <script src="app.js"></script>
</body>
</html>
